<!doctype html><html lang="ko"><meta charset="utf-8"><title>타프 ROI 검수</title>
<style>*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;font:14px 'Malgun Gothic',sans-serif;background:#202222;color:#eee}header{display:flex;align-items:center;gap:20px;padding:12px}h1{font-size:18px;margin:0}a{color:#64d5ba}main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;padding:0 12px 18px}canvas{width:100%;height:100%;background:#111;touch-action:none}aside{overflow:auto}button,select,input{font:inherit;padding:7px;border-radius:4px;border:1px solid #666;background:#303535;color:#eee}button{cursor:pointer}label{display:block;margin:10px 0}#tarps button{display:block;width:100%;text-align:left;margin:5px 0}.active{border-color:#62dabc;color:#62dabc}progress{width:100%}#status{white-space:pre-wrap;font-size:13px}select{max-width:100%}</style>
<header><a id="back">추적 결과</a><h1>타프 ROI 수정·승인</h1><span id="source"></span></header>
<main><canvas id="canvas"></canvas><aside><label>영상 <select id="shot"></select></label><button id="fit">화면 맞춤</button><div id="tarps"></div><button id="reset">현재 타프 다시 지정</button><label>ELC·Ed 기준 영상 <select id="reference"><option value="">미확정</option></select></label><button id="save">수정 저장</button><button id="approve">현재 영상 ROI 승인</button><p id="approved"></p><label>공간 Trim (%) <input id="trim" type="number" min="0" max="20" value="5" style="width:65px"></label><p>중심 기준 축척 0.9 (5%) · P05–P95</p><button id="stats">승인 ROI 통계 생성</button><progress id="progress" max="1" value="0"></progress><p id="status"></p><a id="result" hidden>통계 결과</a></aside></main>
<script>
const $=id=>document.getElementById(id),job=new URLSearchParams(location.search).get('job'),c=$('canvas'),ctx=c.getContext('2d'),im=new Image();
let data,shot,name,points={},dirty=false,z=1,x=0,y=0,drag=null;
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
$('trim').oninput=()=>{$('stats').previousElementSibling.textContent=`중심 기준 축척 ${(1-2*Number($('trim').value)/100).toFixed(2)} · P05–P95`;};
c.onpointercancel=()=>{drag=null;};
$('back').href='/tracking/'+encodeURIComponent(job)+'/index.html';
async function api(url,body){const r=await fetch(url,{cache:'no-store',...(body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{})});const j=await r.json();if(!r.ok)throw Error(j.error);return j;}
function fit(){c.width=c.clientWidth;c.height=c.clientHeight;if(im.naturalWidth){z=Math.min(c.width/im.naturalWidth,c.height/im.naturalHeight);x=(c.width-im.naturalWidth*z)/2;y=(c.height-im.naturalHeight*z)/2;}draw();}
function draw(){ctx.clearRect(0,0,c.width,c.height);if(!im.complete||!im.naturalWidth)return;ctx.save();ctx.translate(x,y);ctx.scale(z,z);ctx.drawImage(im,0,0);for(const [n,p] of Object.entries(points)){if(!p?.length)continue;ctx.strokeStyle=n===name?'#ffe065':'#55d9bb';ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=2/z;ctx.beginPath();p.forEach((v,i)=>i?ctx.lineTo(...v):ctx.moveTo(...v));if(p.length===4)ctx.closePath();ctx.stroke();if(n===name)for(const v of p){ctx.beginPath();ctx.arc(...v,5/z,0,7);ctx.fill();}ctx.font=`${12/z}px sans-serif`;ctx.fillText(n,p[0][0]+8/z,p[0][1]-8/z);}ctx.restore();}
function controls(){$('tarps').replaceChildren(...data.tarps.map(n=>{const b=document.createElement('button');b.textContent=n;b.className=name===n?'active':'';b.onclick=()=>{name=n;controls();draw();};return b;}));$('approved').textContent=`승인 ${Object.values(data.images).filter(r=>r.approved).length}/${Object.keys(data.images).length} · 현재 ${data.images[shot].approved&&!dirty?'승인됨':'검수 필요'}`;}
function load(){shot=$('shot').value;points=structuredClone(data.images[shot].tarps);dirty=false;name=data.tarps[0];im.src='/radiance.png?shot='+shot;controls();}
$('shot').onchange=()=>{if(dirty&&!confirm('저장하지 않은 수정이 있습니다. 영상 전환할까요?')){$('shot').value=shot;return;}load();};
im.onload=fit;im.onerror=()=>$('status').textContent='정합 영상 표시 실패';new ResizeObserver(fit).observe(c);$('fit').onclick=fit;
c.onwheel=e=>{e.preventDefault();const r=c.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,nz=Math.max(.1,Math.min(25,z*Math.exp(-e.deltaY*.002)));x=px-(px-x)*nz/z;y=py-(py-y)*nz/z;z=nz;draw();};
c.onpointerdown=e=>{if(e.button!==0)return;const px=(e.offsetX-x)/z,py=(e.offsetY-y)/z;let idx=(points[name]||[]).findIndex(v=>Math.hypot(v[0]-px,v[1]-py)<10/z);drag={idx,sx:e.offsetX,sy:e.offsetY,x,y,moved:false};c.setPointerCapture(e.pointerId);};
c.onpointermove=e=>{if(!drag)return;const dx=e.offsetX-drag.sx,dy=e.offsetY-drag.sy;if(Math.hypot(dx,dy)>3)drag.moved=true;if(drag.idx>=0){points[name][drag.idx]=[Math.max(0,Math.min(im.naturalWidth-1,(e.offsetX-x)/z)),Math.max(0,Math.min(im.naturalHeight-1,(e.offsetY-y)/z))];dirty=true;controls();}else if(drag.moved){x=drag.x+dx;y=drag.y+dy;}draw();};
c.onpointerup=e=>{if(drag&&!drag.moved&&drag.idx<0&&(points[name]||[]).length<4){const px=(e.offsetX-x)/z,py=(e.offsetY-y)/z;if(px>=0&&py>=0&&px<im.naturalWidth&&py<im.naturalHeight){(points[name]??=[]).push([px,py]);dirty=true;controls();draw();}}drag=null;c.releasePointerCapture(e.pointerId);};
$('reset').onclick=()=>{points[name]=[];dirty=true;controls();draw();};
async function save(approved){try{data=await api('/review/save',{job_id:job,shot,tarps:points,approved,reference_shot:$('reference').value});dirty=false;controls();$('status').textContent=approved?'현재 영상 ROI 승인 완료':'수정 저장 완료 · 미승인';}catch(e){$('status').textContent=e.message;}}
$('save').onclick=()=>save(false);$('approve').onclick=()=>save(true);
$('reference').onchange=()=>{dirty=true;controls();};
$('stats').onclick=async()=>{if(dirty){$('status').textContent='현재 변경을 먼저 저장·승인하세요.';return;}try{$('stats').disabled=true;const j=await api('/review/statistics',{job_id:job,trim_percent:Number($('trim').value)});poll(j.job_id);}catch(e){$('stats').disabled=false;$('status').textContent=e.message;}};
async function poll(id){try{const j=await api('/tracking/status');if(j.job_id!==id)throw Error('작업이 변경되었습니다.');$('progress').max=j.total||1;$('progress').value=j.done||0;$('status').textContent=j.message+` ${j.done}/${j.total}`;if(j.running){setTimeout(()=>poll(id),1500);return;}$('stats').disabled=false;if(j.report){$('result').href=j.report;$('result').hidden=false;}}catch(e){$('status').textContent=e.message;$('stats').disabled=false;}}
api('/review/data?job='+encodeURIComponent(job)).then(j=>{data=j;$('source').textContent=j.source_kind==='raw_DN_boundary_only'?'DN 경계 시험 · ELC 검증 아님':'방사보정 radiance';for(const s of Object.keys(j.images)){for(const id of ['shot','reference'])$(id).add(new Option(s,s));}$('reference').value=j.reference_shot;load();}).catch(e=>$('status').textContent=e.message);
</script></html>
