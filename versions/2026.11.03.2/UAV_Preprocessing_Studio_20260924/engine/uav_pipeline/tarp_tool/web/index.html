<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>위치 참조 타프 후보 검증</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px 'Malgun Gothic',sans-serif;color:#20272a;background:#f5f7f8}header{padding:14px 22px;background:white;border-bottom:1px solid #ccd2d6;display:flex;align-items:center;gap:22px}h1{font-size:19px;margin:0}button,select,input{font:inherit}button{padding:7px 12px;border:1px solid #9aa8ae;background:white;cursor:pointer;border-radius:4px}button.active,button.primary{background:#146b62;color:white}nav{display:flex;gap:8px}main{height:calc(100dvh - 76px);padding:12px 18px 20px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}.view{min-width:0;background:#20272a;overflow:auto;position:relative;display:flex;align-items:flex-start;justify-content:center}.view img{display:block;max-width:100%;max-height:100%;object-fit:contain}.mapwrap{position:relative;display:inline-block;margin:auto}.mapwrap img{max-height:calc(100dvh - 135px)}#marker{position:absolute;width:14px;height:14px;border:2px solid white;background:#e54443;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;display:none}.side{min-height:0;display:flex;flex-direction:column;gap:12px}h2{font-size:16px;margin:0}label{display:block;margin:7px 0}#list{overflow:auto;flex:1;border-top:1px solid #cbd2d6}#list button{display:block;width:100%;text-align:left;border-radius:0;border-width:0 0 1px;padding:9px}#status{white-space:pre-wrap;font-size:13px}progress{width:100%}.hidden{display:none!important}.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}#chosen{font-size:13px}dialog{border:0;padding:10px;max-width:96vw;max-height:94vh}dialog img{max-width:90vw;max-height:85vh} @media(max-width:800px){main{grid-template-columns:minmax(0,1fr) 240px}header{flex-wrap:wrap}nav button{padding:5px}h1{font-size:16px}}
.view{overflow:hidden;touch-action:none;user-select:none;cursor:grab;min-height:0}.view.dragging{cursor:grabbing}.mapwrap{position:absolute;left:0;top:0;margin:0;transform-origin:0 0;will-change:transform}.mapwrap img{pointer-events:none;-webkit-user-drag:none}body{height:100dvh;overflow:hidden;display:flex;flex-direction:column}header{flex-shrink:0}main{height:auto;flex:1;min-height:0}#marker{width:8px;height:8px}
.candidate-row{display:flex;align-items:center;border-bottom:1px solid #cbd2d6;background:white}.candidate-row input{margin:0 10px;cursor:pointer}#list .candidate-row button{flex:1;min-width:0;border:0}.candidate-row.current{background:#e5f1ee}.candidate-row.current button{background:transparent}
.candidate-row.review{border-left:4px solid #b85b16}.candidate-row.unknown{border-left:4px solid #9b3232}#qc{font-size:12px;color:#405057;margin:6px 0;line-height:1.4}
#markerB{position:absolute;width:8px;height:8px;border:2px solid white;background:#e3a837;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;display:none}.location-switch{display:flex;gap:6px;margin:7px 0}.location-switch button.active{background:#146b62;color:white}#pairs{overflow:auto;max-height:150px;border-top:1px solid #cbd2d6}#pairs button{display:block;width:100%;text-align:left;font-size:12px}
</style>
<header><h1>타프 후보 검토</h1><nav><button id="step1" class="active">1 위치 지정</button><button id="step2">2 영상 선택</button><button id="step3">3 ROI 방식</button></nav></header>
<main><section class="view"><div id="map" class="mapwrap"><img id="mosaic" src="/mosaic.png" alt="위치 참조 모자이크"><svg id="circle" viewBox="0 0 1000 1000" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"><path id="circlepath" fill="#ffcc0030" stroke="#ffcc00" stroke-width="2" vector-effect="non-scaling-stroke"/><path id="circlepathB" fill="#e3a83730" stroke="#e3a837" stroke-width="2" vector-effect="non-scaling-stroke"/><path id="linkpath" fill="none" stroke="#e3a837" stroke-dasharray="6 5" stroke-width="2" vector-effect="non-scaling-stroke"/></svg><span id="marker"></span><span id="markerB"></span></div><img id="crop" class="hidden" alt="선택 후보의 타프 주변"></section><aside class="side">
<section id="location"><h2>타프 위치</h2><div class="controls"><button id="minus" title="축소">−</button><button id="plus" title="확대">＋</button><button id="fit">화면 맞춤</button></div><label><input id="two" type="checkbox"> 떨어진 타프 위치 추가</label><div class="location-switch"><button id="locA" class="active">A · 두 타프</button><button id="locB" class="hidden">B · 떨어진 타프</button></div><label id="bTarpRow" class="hidden">B 위치 타프 <select id="bTarp"><option>PNU_3</option><option selected>PNU_36</option><option>PNU_56</option></select></label><label>현재 위치 포함 반경 <input id="radius" type="number" min="2" max="50" value="12" style="width:65px"> m</label><button id="search" class="primary">포함 영상 검색</button></section>
<section id="candidates" class="hidden"><h2 id="shot">후보 영상</h2><p>원영상 DN · 경계 설정용</p><div id="qc"></div><div class="controls"><select id="band"></select><button id="zoom">확대</button></div><label><input type="checkbox" id="pick"> 이 영상 선택</label><div class="controls"><button id="selectAll" title="원영상 10밴드 포화 없는 영상만 선택">포화 없는 영상 전체 선택</button><button id="clearAll">전체 해제</button><span id="chosen">0장 선택</span></div></section>
<section id="method" class="hidden"><h2>ROI 설정 방식</h2><label><input type="radio" name="method" value="manual_centers" checked> 중심 직접 지정 후 자동 경계 추정</label><label><input type="radio" name="method" value="automatic_proposal"> 자동 탐지 후 직접 수정</label><p>다음 단계 대상: 선택 번호의 원영상 DN</p><button id="save" class="primary">선택 영상·방식 저장</button><p>ROI 생성·확정 전</p></section>
<progress id="progress" value="0" max="955"></progress><div id="status">모자이크에서 타프가 모인 곳을 클릭하세요.</div><div id="pairs" class="hidden"></div><div id="list"></div></aside></main><dialog id="large"><button id="close">닫기</button><img id="largeimg"></dialog>
<script>
const $=id=>document.getElementById(id);let points=[null,null],radii=[12,8],active=0,rows=[],selected=new Set(),current=null,scale=1,circleRequest=[0,0];
const view=document.querySelector('.view');
let panX=0,panY=0,mapW=0,mapH=0,gesture=null,frame=0;
function paintMap(){if(frame)return;frame=requestAnimationFrame(()=>{frame=0;$('map').style.transform=`translate(${panX}px,${panY}px) scale(${scale})`;$('marker').style.transform=`translate(-50%,-50%) scale(${1/scale})`;});}
function resizeMap(){const im=$('mosaic');if(!im.naturalWidth)return;const fit=Math.min(view.clientWidth/im.naturalWidth,view.clientHeight/im.naturalHeight);mapW=im.naturalWidth*fit;mapH=im.naturalHeight*fit;$('map').style.width=mapW+'px';$('map').style.height=mapH+'px';im.style.cssText='width:100%;height:100%;max-width:none;max-height:none';scale=1;panX=(view.clientWidth-mapW)/2;panY=(view.clientHeight-mapH)/2;paintMap();}
function zoomMap(f,x=view.clientWidth/2,y=view.clientHeight/2){const next=Math.max(1,Math.min(16,scale*f));const ratio=next/scale;panX=x-(x-panX)*ratio;panY=y-(y-panY)*ratio;scale=next;paintMap();}
$('plus').onclick=()=>zoomMap(1.5);$('minus').onclick=()=>zoomMap(1/1.5);$('fit').onclick=resizeMap;$('mosaic').onload=resizeMap;if($('mosaic').complete)resizeMap();new ResizeObserver(resizeMap).observe(view);
view.addEventListener('wheel',e=>{if($('map').classList.contains('hidden'))return;e.preventDefault();const r=view.getBoundingClientRect();zoomMap(Math.exp(-Math.max(-150,Math.min(150,e.deltaY))*.002),e.clientX-r.left,e.clientY-r.top);},{passive:false});
view.addEventListener('pointerdown',e=>{if(e.button!==0||$('map').classList.contains('hidden'))return;e.preventDefault();gesture={id:e.pointerId,x:e.clientX,y:e.clientY,px:panX,py:panY,moved:false};view.setPointerCapture(e.pointerId);});
view.addEventListener('pointermove',e=>{if(!gesture||gesture.id!==e.pointerId)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(Math.hypot(dx,dy)>4)gesture.moved=true;if(gesture.moved){panX=gesture.px+dx;panY=gesture.py+dy;view.classList.add('dragging');paintMap();}});
view.addEventListener('pointerup',e=>{if(!gesture||gesture.id!==e.pointerId)return;const moved=gesture.moved;gesture=null;view.classList.remove('dragging');view.releasePointerCapture(e.pointerId);if(!moved){const r=view.getBoundingClientRect();const u=(e.clientX-r.left-panX)/(mapW*scale),v=(e.clientY-r.top-panY)/(mapH*scale);if(u>=0&&u<=1&&v>=0&&v<=1){points[active]={u,v};drawCircle(active);}}});
view.addEventListener('pointercancel',()=>{gesture=null;view.classList.remove('dragging');});
async function drawCircle(i){const point=points[i],marker=$(i?'markerB':'marker'),path=$(i?'circlepathB':'circlepath');marker.style.display=point&&(!i||$('two').checked)?'block':'none';path.style.display=marker.style.display;if(!point)return;marker.style.left=point.u*100+'%';marker.style.top=point.v*100+'%';$('linkpath').setAttribute('d',$('two').checked&&points.every(Boolean)?`M${points[0].u*1000},${points[0].v*1000} L${points[1].u*1000},${points[1].v*1000}`:'');let id=++circleRequest[i];try{let r=await fetch(`/circle?u=${point.u}&v=${point.v}&radius=${radii[i]}`);if(!r.ok)throw Error('반경은 2~50m로 입력하세요.');let pts=await r.json();if(id!==circleRequest[i])return;path.setAttribute('d',pts.map((p,j)=>(j?'L':'M')+p.join(',')).join(' ')+' Z');}catch(e){$('status').textContent=e.message;}}
function switchLocation(i){active=i;$('radius').value=radii[i];$('locA').classList.toggle('active',i===0);$('locB').classList.toggle('active',i===1);}
$('locA').onclick=()=>switchLocation(0);$('locB').onclick=()=>switchLocation(1);
$('two').onchange=()=>{$('locB').classList.toggle('hidden',!$('two').checked);$('bTarpRow').classList.toggle('hidden',!$('two').checked);if(!$('two').checked)switchLocation(0);drawCircle(0);drawCircle(1);};
$('radius').oninput=()=>{radii[active]=Number($('radius').value);drawCircle(active);};
const bands=['Blue_444nm','Blue_475nm','Green_531nm','Green_560nm','Red_650nm','Red_668nm','RedEdge_705nm','RedEdge_717nm','RedEdge_740nm','NIR_842nm'];bands.forEach((b,i)=>$('band').add(new Option(`${i+1} ${b}`,i+1)));$('band').value=6;
function stage(n){['location','candidates','method'].forEach((v,i)=>$(v).classList.toggle('hidden',i!==n-1));[1,2,3].forEach(i=>$('step'+i).classList.toggle('active',i===n));$('map').classList.toggle('hidden',n!==1);$('crop').classList.toggle('hidden',n===1);}
[1,2,3].forEach(i=>$('step'+i).onclick=()=>stage(i));
async function post(path,data){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw Error(j.error);return j;}
function syncSelection(){$('chosen').textContent=`${selected.size}/${rows.filter(r=>r.radiance_ready&&r.saturation_qc?.status!=='unknown').length}장 선택`;$('pick').checked=!!current&&selected.has(current.id);document.querySelectorAll('.candidate-row').forEach(el=>{el.querySelector('input').checked=selected.has(el.dataset.id);el.classList.toggle('current',el.dataset.id===current?.id);});}
function setSelected(row,checked){if(!row.radiance_ready||row.saturation_qc?.status==='unknown')return;checked?selected.add(row.id):selected.delete(row.id);syncSelection();}
function renderCandidates(){$('list').replaceChildren();rows.sort((a,b)=>({clear:0,review:1,unknown:2}[a.saturation_qc?.status]??2)-({clear:0,review:1,unknown:2}[b.saturation_qc?.status]??2));rows.forEach(row=>{const el=document.createElement('div');el.className='candidate-row '+(row.saturation_qc?.status||'unknown');el.dataset.id=row.id;const cb=document.createElement('input');cb.type='checkbox';cb.setAttribute('aria-label',row.shot+' 선택');cb.disabled=!row.radiance_ready||row.saturation_qc?.status==='unknown';cb.onchange=()=>setSelected(row,cb.checked);const b=document.createElement('button');const status=row.saturation_qc?.status;b.textContent=row.shot+' · '+(row.coverage_locations||['A']).join('')+(row.capture_time_kst?' · KST '+row.capture_time_kst.slice(11,19):'')+(row.radiance_ready?'':' · 원영상 누락')+(status==='clear'?' · 포화 없음':status==='review'?' · 포화 감지':' · 검사 불가');b.onclick=()=>{stage(2);show(row)};el.append(cb,b);$('list').append(el);});syncSelection();}
function show(row){current=row;$('shot').textContent=row.shot;$('crop').src=`/crop.png?id=${encodeURIComponent(row.id)}&band=${$('band').value}`;$('pick').disabled=!row.radiance_ready||row.saturation_qc?.status==='unknown';const qc=row.saturation_qc||{};const hit=(qc.bands||[]).filter(b=>b.saturated_pixels);$('qc').textContent=qc.reason+(hit.length?' · '+hit.map(b=>`B${b.band} ${b.saturated_pct}%`).join(', '):'')+' · 원영상 전체 예비검사 (타프 내부는 ROI 승인 후 확인)';syncSelection();}
$('band').onchange=()=>current&&show(current);$('pick').onchange=()=>{if(current)setSelected(current,$('pick').checked);};
$('selectAll').onclick=()=>{rows.filter(r=>r.radiance_ready&&r.saturation_qc?.status==='clear').forEach(r=>selected.add(r.id));syncSelection();};$('clearAll').onclick=()=>{selected.clear();syncSelection();};
function requestedLocations(){const b=$('bTarp').value,names=['PNU_3','PNU_36','PNU_56'];return points.slice(0,$('two').checked?2:1).map((p,i)=>({...p,radius:radii[i],tarps:i?[b]:$('two').checked?names.filter(n=>n!==b):names}));}
$('search').onclick=async()=>{try{if(!points[0]||$('two').checked&&!points[1])throw Error('A와 B 위치를 먼저 클릭하세요.');await post('/search',{locations:requestedLocations()});selected.clear();$('chosen').textContent='0장 선택';$('list').replaceChildren();$('search').disabled=true;poll();}catch(e){$('status').textContent=e.message;}};
async function poll(){try{let s=await(await fetch('/state')).json();$('progress').max=s.total;$('progress').value=s.done;$('status').textContent=`${s.done}/${s.total} Photos 확인·원영상 포화 검사 · 오류 ${s.errors.length}개`;if(s.running){setTimeout(poll,800);return;}$('search').disabled=false;rows=s.candidates;selected=new Set((s.selected_ids||[]).filter(id=>rows.some(r=>r.id===id&&r.radiance_ready)));if(!selected.size&&s.locations?.length===2&&s.pairs?.length)selected=new Set([s.pairs[0].a_id,s.pairs[0].b_id]);const clear=rows.filter(r=>r.saturation_qc?.status==='clear').length,review=rows.filter(r=>r.saturation_qc?.status==='review').length,unknown=rows.length-clear-review;$('status').textContent=`반경 전체 포함 ${rows.length}장 · 포화 없음 ${clear} · 포화 감지 ${review} · 검사 불가 ${unknown}\nGPS·촬영시각은 영상 쌍 제안용입니다. Ed 안정성은 04단계 확인이 필요합니다.`;if(s.errors.length)$('status').textContent+='\n검색 오류: '+s.errors[0].error+'\n오류가 있는 동안 후보 없음으로 판단하지 마세요.';$('pairs').replaceChildren();$('pairs').classList.toggle('hidden',!s.pairs?.length);(s.pairs||[]).forEach(p=>{const b=document.createElement('button');b.textContent=`${p.a_shot} + ${p.b_shot} · ${p.delta_seconds==null?'시간 미확인':p.delta_seconds.toFixed(1)+'초'} · ${p.route_match?'GPS 연결선 평행':'경로 확인'}`;b.onclick=()=>{selected=new Set([p.a_id,p.b_id]);syncSelection();show(rows.find(r=>r.id===p.a_id));};$('pairs').append(b)});renderCandidates();stage(2);if(rows.length)show(rows[0]);else{current=null;$('crop').removeAttribute('src');$('shot').textContent=s.errors.length?'검색 오류 · 확인 필요':'전체 포함 후보 없음';}}catch(e){$('status').textContent=e.message;$('search').disabled=false;}}
$('zoom').onclick=()=>{if(!current)return;$('largeimg').src=$('crop').src;$('large').showModal()};$('close').onclick=()=>$('large').close();$('crop').onclick=$('zoom').onclick;
$('save').textContent='선택 후보 저장';
const resume=document.createElement('a');resume.href='/roi.html';resume.textContent='방사보정이 완료된 선택 영상으로 타프 ROI 설정';resume.style.display='block';resume.style.marginTop='10px';$('method').append(resume);
$('save').onclick=async()=>{try{const saved=await post('/save',{ids:[...selected],method:document.querySelector('[name=method]:checked').value,locations:requestedLocations()});if(saved.split_locations){$('status').textContent='두 위치 영상 쌍 저장 완료. 현재 ROI·ELC는 한 장에 세 타프가 있는 경우만 지원합니다. 분리 영상 계수 산출은 실행하지 마세요.';resume.hidden=true;}else if(saved.source_kind==='raw_DN_boundary_only'){$('status').textContent='후보 영상 저장 완료\n앱으로 돌아가 「선택 후보 우선 방사보정」을 실행하세요.';resume.hidden=true;}else{location.href='/roi.html';}}catch(e){$('status').textContent=e.message;}};
fetch('/state').then(r=>r.json()).then(s=>{const locs=s.locations?.length?s.locations:s.point?[{point:s.point,radius_m:s.radius_m||12}]:[];locs.slice(0,2).forEach((loc,i)=>{points[i]={u:loc.point.u,v:loc.point.v};radii[i]=loc.radius_m;drawCircle(i);});if(locs.length===2){$('two').checked=true;$('bTarp').value=locs[1].tarps[0];$('two').onchange();}$('radius').value=radii[0];if(s.candidates?.length)poll();});
</script></html>
