<!doctype html><html lang="ko"><meta charset="utf-8"><title>타프 중심 지정</title><style>
*{box-sizing:border-box}body{margin:0;font:14px 'Malgun Gothic',sans-serif;color:#263333;background:#f3f6f5;height:100dvh;display:flex;flex-direction:column}header{padding:16px;display:flex;gap:24px;background:white}a{color:#136c61}h1{font-size:19px;margin:0}main{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px;padding:14px;flex:1;min-height:0}canvas{width:100%;height:100%;background:#222c2c;touch-action:none;cursor:grab}aside{overflow:auto}button,input,select{font:inherit;padding:7px}label{display:block;margin:12px 0}button{cursor:pointer;border:1px solid #9aa;background:white;border-radius:4px}#names button{display:block;width:100%;text-align:left;margin:5px 0}.active,#save{background:#146b62!important;color:white}#status{white-space:pre-wrap}p{font-size:13px}
</style><header><a href="/">← 영상 선택</a><h1>4 타프 중심·크기 지정</h1></header><main><canvas id="c"></canvas><aside><label>기준 영상 <select id="ref"></select></label><button id="fit">화면 맞춤</button><p>방사보정 RGB · Band6 좌표 기준 정합</p><label>PNU 기본 크기 <input id="pnu" type="number" min="2" max="300" value="65" style="width:75px"> px</label><label hidden style="display:none">NIAS 기본 크기 <input id="nias" type="number" min="2" max="300" value="30" style="width:75px"> px</label><div id="names"></div><label>현재 타프 가로 <input id="tw" type="number" min="2" max="300" value="65"> px</label><label>현재 타프 세로 <input id="th" type="number" min="2" max="300" value="65"> px</label><button id="corners">현재 타프 네 꼭짓점 직접 지정</button><button id="remove">현재 타프 지우기</button><button id="save">중심·크기 저장</button><p id="status">선택 영상 불러오는 중</p></aside></main><script>
const $=id=>document.getElementById(id),c=$('c'),ctx=c.getContext('2d'),im=new Image();const names=['PNU_3','PNU_36','PNU_56'];let data,tarps={},reference='',name=names[0],z=1,x=0,y=0,drag=null,cornerMode=false,cornerPoints=[];
let proposals=[];
function render(){ctx.clearRect(0,0,c.width,c.height);if(!im.complete||!im.naturalWidth)return;ctx.save();ctx.translate(x,y);ctx.scale(z,z);ctx.drawImage(im,0,0);Object.entries(tarps).forEach(([n,p])=>{ctx.strokeStyle=p.status==='failed'?'#ff796d':n===name?'#ffde36':'#36e4cd';ctx.lineWidth=2/z;if(p.points){ctx.beginPath();p.points.forEach((v,i)=>i?ctx.lineTo(...v):ctx.moveTo(...v));ctx.closePath();ctx.stroke();}else{ctx.setLineDash([5/z,4/z]);ctx.strokeRect(p.x-(p.width||p.size)/2,p.y-(p.height||p.size)/2,p.width||p.size,p.height||p.size);ctx.setLineDash([]);}ctx.beginPath();ctx.arc(p.x,p.y,3/z,0,7);ctx.stroke();ctx.font=`${13/z}px sans-serif`;ctx.fillStyle=ctx.strokeStyle;ctx.fillText(n,p.x+p.size/2+4/z,p.y);});if(cornerPoints.length){ctx.strokeStyle='#ffde36';ctx.fillStyle='#ffde36';ctx.lineWidth=2/z;ctx.beginPath();cornerPoints.forEach((p,i)=>{i?ctx.lineTo(...p):ctx.moveTo(...p);ctx.beginPath();ctx.arc(p[0],p[1],4/z,0,7);ctx.fill()});}ctx.restore();}
const auto=document.createElement('button');auto.textContent='밴드별 최적 경계 찾기';$('names').before(auto);auto.onclick=async()=>{if(!Object.keys(tarps).length){$('status').textContent='타프 이름을 선택하고 중심을 먼저 찍어주세요.';return;}auto.disabled=true;const version=JSON.stringify(tarps),shot=reference;$('status').textContent='Band 2·3·4·6·10에서 타프별 최적 경계 탐색 중';try{let r=await fetch('/roi/boundaries',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({selection_file:data.selection_file,reference,tarps})});let j=await r.json();if(!r.ok)throw Error(j.error);if(shot!==reference||version!==JSON.stringify(tarps))throw Error('입력이 바뀌었습니다. 다시 실행하세요.');Object.entries(j.results).forEach(([n,p])=>{delete tarps[n].points;Object.assign(tarps[n],p);});buttons();render();$('status').textContent=Object.entries(j.results).map(([n,p])=>n+': '+(p.status==='review'?('Band '+p.selected_band+' 선택 · 확인 필요'):'실패 · 중심/크기 수정')).join('\n');}catch(e){$('status').textContent=e.message;}finally{auto.disabled=false;}};
fetch('/tracking_latest.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j){for(const [key,label] of [['url','추적 결과 · 공간 trim 5%'],['histograms_url','타프별 히스토그램 · P05–P95'],['normality_url','분포 정량 비교 · P05–P95']]){if(!j[key])continue;const a=document.createElement('a');a.href=j[key];a.textContent=label;a.style.display='block';a.style.margin='10px 0';$('status').before(a);}}});
function fit(){c.width=c.clientWidth;c.height=c.clientHeight;z=Math.min(c.width/im.naturalWidth,c.height/im.naturalHeight);x=(c.width-im.naturalWidth*z)/2;y=(c.height-im.naturalHeight*z)/2;render();}im.onload=fit;new ResizeObserver(()=>im.naturalWidth&&fit()).observe(c);$('fit').onclick=fit;
function buttons(){const p=tarps[name];$('tw').value=p?.width||p?.size||$('pnu').value;$('th').value=p?.height||p?.size||$('pnu').value;$('names').replaceChildren();names.forEach(n=>{const b=document.createElement('button');b.textContent=n+(tarps[n]?(tarps[n].status==='failed'?' · 실패':tarps[n].points?' · 경계 확인':' · 중심 지정'):'');b.className=n===name?'active':'';b.onclick=()=>{name=n;cornerMode=false;cornerPoints=[];buttons();render()};$('names').append(b)});}
function load(){reference=$('ref').value;proposals=[];im.src='/radiance.png?shot='+reference;buttons();}
$('ref').onchange=()=>{if(Object.keys(tarps).length&&!confirm('기준 영상을 바꾸면 현재 중심 지정을 초기화합니다. 계속할까요?')){$('ref').value=reference;return;}tarps={};load();};
c.onwheel=e=>{e.preventDefault();const r=c.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,nz=Math.max(.1,Math.min(15,z*Math.exp(-Math.max(-150,Math.min(150,e.deltaY))*.002)));x=px-(px-x)*nz/z;y=py-(py-y)*nz/z;z=nz;render();};
c.onpointerdown=e=>{if(e.button!==0)return;drag={x:e.offsetX,y:e.offsetY,px:x,py:y,moved:false};c.setPointerCapture(e.pointerId)};
c.onpointermove=e=>{if(!drag)return;let dx=e.offsetX-drag.x,dy=e.offsetY-drag.y;if(Math.hypot(dx,dy)>4)drag.moved=true;if(drag.moved){x=drag.px+dx;y=drag.py+dy;render()}};
c.onpointerup=e=>{if(!drag)return;if(!drag.moved){let px=(e.offsetX-x)/z,py=(e.offsetY-y)/z;if(px>=0&&py>=0&&px<im.naturalWidth&&py<im.naturalHeight){if(cornerMode){cornerPoints.push([px,py]);if(cornerPoints.length===4){const cx=cornerPoints.reduce((s,p)=>s+p[0],0)/4,cy=cornerPoints.reduce((s,p)=>s+p[1],0)/4,pts=cornerPoints.sort((a,b)=>Math.atan2(a[1]-cy,a[0]-cx)-Math.atan2(b[1]-cy,b[0]-cx)),dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]),w=(dist(pts[0],pts[1])+dist(pts[2],pts[3]))/2,h=(dist(pts[1],pts[2])+dist(pts[3],pts[0]))/2;tarps[name]={x:cx,y:cy,size:Math.sqrt(w*h),width:w,height:h,points:pts,status:'review',method:'manual_four_corners',confirmed:false};cornerMode=false;cornerPoints=[];buttons();$('status').textContent=name+' 네 꼭짓점 지정 완료 · 저장 후 자동 추적 기준으로 사용';}else $('status').textContent=name+' 꼭짓점 '+cornerPoints.length+'/4';render();}else{tarps[name]={x:px,y:py,size:Number($(name.startsWith('PNU')?'pnu':'nias').value),width:Number($('tw').value),height:Number($('th').value)};buttons();render();}}}drag=null;c.releasePointerCapture(e.pointerId)};c.onpointercancel=()=>drag=null;
['pnu','nias'].forEach(id=>$(id).oninput=()=>{let v=Number($(id).value);if(v<2||v>300)return;Object.entries(tarps).forEach(([n,p])=>{if(n.toLowerCase().startsWith(id)){p.size=v;p.width=v;p.height=v;delete p.points;delete p.status;}});buttons();render()});$('remove').onclick=()=>{delete tarps[name];cornerMode=false;cornerPoints=[];buttons();render()};
['tw','th'].forEach(id=>$(id).oninput=()=>{const p=tarps[name],v=Number($(id).value);if(!p||v<2||v>300)return;p[id==='tw'?'width':'height']=v;delete p.points;delete p.status;render();});
$('corners').onclick=()=>{cornerMode=true;cornerPoints=[];$('status').textContent=name+' 외곽 네 꼭짓점을 차례로 클릭하세요. 접힘선과 그림자는 클릭하지 않습니다.';render()};
$('save').textContent='중심·경계 결과 저장';
$('save').onclick=async()=>{try{if(!Object.keys(tarps).length)throw Error('타프 중심을 지정하세요.');let r=await fetch('/roi/seeds',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({selection_file:data.selection_file,reference,tarps})});let j=await r.json();if(!r.ok)throw Error(j.error);$('status').textContent='중심·경계 결과 저장 완료\n최종 승인·trim·다른 영상 추적 전\n'+j.saved;}catch(e){$('status').textContent=e.message}};
fetch('/selection/latest').then(r=>r.json()).then(j=>{if(j.error)throw Error(j.error);data=j;j.selected.forEach(r=>$('ref').add(new Option(r.shot,r.shot)));if(j.seeds){$('ref').value=j.seeds.reference;tarps=j.seeds.tarps;for(const [n,p] of Object.entries(tarps))$(n.startsWith('PNU')?'pnu':'nias').value=p.size;}load();$('status').textContent=`선택 영상 ${j.selected.length}장\n기준 영상에서 타프 이름을 선택하고 중심을 클릭하세요.`;}).catch(e=>$('status').textContent=e.message);
</script></html>
